[project]
name = "linkedin-mcp"
version = "0.1.0"
description = "LinkedIn MCP server — manage your LinkedIn presence from Claude"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.28.1,<2",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "playwright>=1.44.0",
    "keyring>=25.0",
    "browser-cookie3>=0.20.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "respx>=0.21",
    "freezegun>=1.4",
]

[tool.uv]
# Floors for transitive dependencies with published advisories
# (PYSEC-2026-3552/3553/3554, PYSEC-2026-248/249, CVE-2026-58203, PYSEC-2026-3036/3037/3040).
constraint-dependencies = [
    "cryptography>=50.0.0",
    "starlette>=1.3.1",
    "pydantic-settings>=2.14.2",
    "python-multipart>=0.0.31",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["linkedin_mcp"]
