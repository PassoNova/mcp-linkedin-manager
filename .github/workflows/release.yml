name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "latest"

      - name: Install dependencies
        working-directory: mcp
        run: uv sync --group dev

      - name: Run tests
        working-directory: mcp
        run: uv run pytest tests/ --ignore=tests/test_playwright_pool.py -v

  build-plugin:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build linkedin-mcp.plugin
        run: |
          cp README.md mcp/README.md
          zip -r linkedin-mcp.plugin \
            mcp/*.py \
            mcp/linkedin_mcp/ \
            mcp/pyproject.toml \
            mcp/uv.lock \
            mcp/README.md \
            skills/ \
            .claude-plugin/ \
            .mcp.json \
            .env.example \
            README.md

      - name: Generate SHA256 checksum
        run: sha256sum linkedin-mcp.plugin > linkedin-mcp.plugin.sha256

      - name: Upload plugin artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linkedin-mcp-plugin
          path: |
            linkedin-mcp.plugin
            linkedin-mcp.plugin.sha256
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            linkedin-mcp.plugin
            linkedin-mcp.plugin.sha256
          generate_release_notes: true
